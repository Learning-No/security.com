services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ironhaven
      POSTGRES_USER: ironhaven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironhaven -d ironhaven"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - private

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ironhaven:${POSTGRES_PASSWORD}@db:5432/ironhaven
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - private

volumes:
  postgres_data:

networks:
  private:
    driver: bridge
